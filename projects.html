<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Alp Cihan</title>
  <meta name="description" content="Projects by Alp Cihan">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="projects.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="/" class="name-link"><h1 class="name">Alp Cihan</h1></a>
      <div class="page-links">
        <a href="/" class="page-link">About</a>
        <span class="current-page-link">Projects</span>
      </div>
    </header>
    
    <div class="projects-grid" id="projects-container">
    </div>

    <script>
      const projects = [
        {
          title: "RTX Gaussian Splatting",
          image: "/images/project-rtxgs-00.jpg",
          description: "3D Gaussian Splat renderer with RTX acceleration",
          technologies: ["C++", "Vulkan", "CMake"],
        },
        {
          title: "WTrace",
          image: "/images/project-wtrace-00.jpg",
          description: "Real-time path tracing library for web",
          technologies: ["WebGPU", "WGSL", "TypeScript", "Node.js"],
          github: "https://github.com/alpcihan/wtrace",
        },
        {
          title: "Hybrid", 
          image: "/images/project-hybrid-00.jpg",
          description: "Hybrid renderer for triangle meshes and SDFs with RTX support",
          technologies: ["C++", "Vulkan", "CMake"],
          github: "https://github.com/alpcihan/hybrid"
        },
        {
          title: "ARkonoid",
          image: "/images/project-arkanoid-00.jpg", 
          description: "3D AR version of Arkanoid game with a custom pose estimator and renderer",
          technologies: ["C++", "OpenGL", "OpenCV","CMake"],
          github: "https://github.com/alpcihan/arkanoid"
        }
      ];

      function createProjectElement(project) {
        const techTags = project.technologies.map(tech => 
          `<span class="tech-tag">${tech}</span>`
        ).join('');

        // Create icon links for GitHub and YouTube
        const createIconLink = (url, iconSvg, ariaLabel) => {
          if (!url) return '';
          return `
            <a href="${url}" target="_blank" class="project-icon-link" aria-label="${ariaLabel}">
              ${iconSvg}
            </a>
          `;
        };

        const githubIcon = `
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
        `;

        const youtubeIcon = `
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        `;

        const githubLink = createIconLink(project.github, githubIcon, `${project.title} GitHub repository`);
        const youtubeLink = createIconLink(project.youtube, youtubeIcon, `${project.title} YouTube video`);

        return `
          <div class="project">
            <h2 class="project-title">
              <span class="project-title-text">${project.title}</span><div class="project-icons">${githubLink}${youtubeLink}</div>
              
            </h2>
            <div class="project-image">
              ${project.image ? `<img src="${project.image}" alt="${project.title}" loading="lazy">` : ''}
            </div>
            <div class="project-content">
              <p class="project-description">
                ${project.description}
              </p>
              <div class="project-tech">
                ${techTags}
              </div>
            </div>
          </div>
        `;
      }

      function renderProjects() {
        const container = document.getElementById('projects-container');
        const projectsHTML = projects.map(createProjectElement).join('');
        container.innerHTML = projectsHTML;
      }

      document.addEventListener('DOMContentLoaded', renderProjects);
    </script>
  </div>
</body>
</html>
